name: release
# Raise the number in VERSION on main (e.g. 1.2) -> builds the .exe on Windows and publishes a GitHub release with
#   AoE2-Counter-Overlay.exe          (single file, no Python needed)
#   AoE2-Counter-Overlay-source.zip   (start.bat / demo.bat, for PCs that block unsigned .exe files)
# Stable direct links: https://github.com/j-n-w/aoe2-overlay/releases/latest/download/<file name>
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: |
          python -m pip install -q -r requirements.txt pyinstaller
          python tools\check_data.py || exit /b 1
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AoE2-Counter-Overlay --collect-submodules websockets --add-data "data\techtree;data\techtree" --add-data "data\civ_tips.en.json;data" --add-data "data\maps.en.json;data" --add-data "data\maps_official.json;data" --add-data "data\unit_texts_game.json;data" run_overlay.py
      - name: Source zip
        shell: bash
        run: git archive --format=zip --prefix=aoe2-overlay/ -o dist/AoE2-Counter-Overlay-source.zip HEAD
      - name: Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \r\n' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AoE2-Counter-Overlay.exe dist/AoE2-Counter-Overlay-source.zip --clobber
            exit 0
          fi
          cat > notes.md <<'EOF'
          **AoE2-Counter-Overlay.exe** – download and double-click, no installation. It sits as a yellow "C" in the tray and shows up by itself when your game starts.
          On the first start it asks who you are (Stammtisch list, or your aoe2companion profile id / link).

          If Windows blocks the .exe ("Smart App Control"): use **AoE2-Counter-Overlay-source.zip**, install Python 3.12 (Microsoft Store or python.org) and double-click `start.bat`.

          Set AoE2 to *Windowed Fullscreen / borderless*. F9 show/hide · Shift+F9 compact/detail · Ctrl+F9 click-through.
          Reads only public match data from aoe2companion.com – no game memory, no input, no screen reading.
          EOF
          gh release create "$TAG" dist/AoE2-Counter-Overlay.exe dist/AoE2-Counter-Overlay-source.zip \
            --target "$GITHUB_SHA" --title "AoE2 Counter Overlay $TAG" --notes-file notes.md
